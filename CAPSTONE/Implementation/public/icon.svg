<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#273552" stroke-width="8"/>
  
  <!-- Subtle Circuit Lines -->
  <circle cx="256" cy="256" r="180" stroke="#273552" stroke-width="3" stroke-dasharray="12 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="220" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Main Shield -->
  <path d="M256 90 L390 145 C390 280 256 390 256 420 C256 390 122 280 122 145 Z" 
        fill="url(#shieldGrad)" 
        fill-opacity="0.15" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Glowing Core Symbol: AI Brain / Lightning Bolt -->
  <path d="M275 160 L185 270 L245 270 L235 350 L325 240 L265 240 Z" 
        fill="#38bdf8" 
        filter="url(#glow)"/>
</svg>
